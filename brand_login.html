<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Login - Kusumira</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f0e8 0%, #fdf6ee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(202,118,44,0.15);
      width: 100%;
      max-width: 460px;
      padding: 2.5rem 2.5rem 2rem;
      animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Satisfy', cursive;
      font-size: 1.8rem;
      color: #ca762c;
      text-align: center;
      margin-bottom: 0.2rem;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 0.85rem;
      margin-bottom: 1.8rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #f8f0e8;
      border-radius: 50px;
      padding: 4px;
      margin-bottom: 1.8rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 50px;
      background: transparent;
      color: #888;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'Poppins', sans-serif;
    }

    .tab-btn.active {
      background: white;
      color: #ca762c;
      box-shadow: 0 2px 10px rgba(202,118,44,0.2);
    }

    /* Forms */
    .form-section { display: none; }
    .form-section.active { display: block; }

    .field {
      position: relative;
      margin-bottom: 1rem;
    }

    .field i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #ccc;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .field input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      border: 1.5px solid #e5d9cc;
      border-radius: 50px;
      font-size: 0.93rem;
      outline: none;
      background: #fafafa;
      color: #222;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Poppins', sans-serif;
    }

    .field input:focus {
      border-color: #ca762c;
      box-shadow: 0 0 0 3px rgba(202,118,44,0.12);
      background: white;
    }

    .field:focus-within i { color: #ca762c; }

    .submit-btn {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #e79b38, #ca762c);
      border: none;
      border-radius: 50px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 8px 20px -6px rgba(202,118,44,0.55);
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -6px rgba(202,118,44,0.65);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.2rem 0;
      color: #bbb;
      font-size: 0.82rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ede5d8;
    }

    /* Google button */
    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.85rem;
      border: 1.5px solid #e8ddd0;
      border-radius: 50px;
      background: white;
      font-size: 0.93rem;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: background 0.15s, border-color 0.15s;
    }

    .google-btn:hover {
      background: #fff8f0;
      border-color: #ca762c;
    }

    /* Message */
    .msg {
      text-align: center;
      font-size: 0.88rem;
      padding: 0.6rem 1rem;
      border-radius: 50px;
      margin-top: 1rem;
      display: none;
    }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.error   { background: #fdecea; color: #c62828; display: block; }

    .back-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: #999;
    }
    .back-link a { color: #ca762c; text-decoration: none; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">Kusumira</div>
  <p class="subtitle">🏢 Brand Seller Portal</p>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
    <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <!-- LOGIN FORM -->
  <div class="form-section active" id="loginSection">
    <div class="field">
      <input type="email" id="loginEmail" placeholder="Brand Email" autocomplete="email">
      <i class="fas fa-envelope"></i>
    </div>
    <div class="field">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <i class="fas fa-lock"></i>
    </div>
    <button class="submit-btn" onclick="brandLogin()">
      <i class="fas fa-sign-in-alt" style="margin-right:6px;"></i> Sign In
    </button>

    <div class="divider">or continue with</div>

    <button class="google-btn" onclick="googleLogin()">
      <i class="fab fa-google" style="color:#e34234;"></i> Sign in with Google
    </button>

    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- SIGNUP FORM -->
  <div class="form-section" id="signupSection">
    <div class="field">
      <input type="text" id="signupName" placeholder="Brand / Business Name">
      <i class="fas fa-store"></i>
    </div>
    <div class="field">
      <input type="email" id="signupEmail" placeholder="Brand Email">
      <i class="fas fa-envelope"></i>
    </div>
    <div class="field">
      <input type="password" id="signupPassword" placeholder="Create Password">
      <i class="fas fa-lock"></i>
    </div>
    <div class="field">
      <input type="password" id="signupConfirm" placeholder="Confirm Password">
      <i class="fas fa-lock"></i>
    </div>
    <button class="submit-btn" onclick="brandSignup()">
      <i class="fas fa-user-plus" style="margin-right:6px;"></i> Create Brand Account
    </button>

    <div class="divider">or continue with</div>

    <button class="google-btn" onclick="googleLogin()">
      <i class="fab fa-google" style="color:#e34234;"></i> Sign up with Google
    </button>

    <div id="signupMsg" class="msg"></div>
  </div>

  <div class="back-link">
    <a href="/mainpage.html"><h4>← Back to Kusumira</h4> </a>
  </div>
</div>

<script>
  // ── Switch tabs ─────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
    });
    document.getElementById('loginSection').classList.toggle('active', tab === 'login');
    document.getElementById('signupSection').classList.toggle('active', tab === 'signup');
  }

  // ── Show message ────────────────────────────────────────
  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  // ── Brand Login ─────────────────────────────────────────
  function brandLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
      showMsg('loginMsg', '⚠️ Please fill in all fields', 'error');
      return;
    }

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        showMsg('loginMsg', '✅ Welcome back! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/brand_dashboard.html';
        }, 1000);
      } else {
        showMsg('loginMsg', '❌ ' + (data.message || 'Login failed'), 'error');
      }
    })
    .catch(() => showMsg('loginMsg', '❌ Server error. Try again.', 'error'));
  }

  // ── Brand Signup ────────────────────────────────────────
  function brandSignup() {
    const name     = document.getElementById('signupName').value.trim();
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value.trim();
    const confirm  = document.getElementById('signupConfirm').value.trim();

    if (!name || !email || !password || !confirm) {
      showMsg('signupMsg', '⚠️ Please fill in all fields', 'error');
      return;
    }

    if (password !== confirm) {
      showMsg('signupMsg', '❌ Passwords do not match', 'error');
      return;
    }

    if (password.length < 6) {
      showMsg('signupMsg', '❌ Password must be at least 6 characters', 'error');
      return;
    }

    fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        showMsg('signupMsg', '✅ Account created! Please sign in.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      } else {
        showMsg('signupMsg', '❌ ' + (data.message || 'Signup failed'), 'error');
      }
    })
    .catch(() => showMsg('signupMsg', '❌ Server error. Try again.', 'error'));
  }

  // ── Google Login ────────────────────────────────────────
  function googleLogin() {
  window.location.href = '/auth/google?from=brand'; // ✅ uses query param
}

  // ── If already logged in, skip to dashboard ─────────────
  fetch('/get-user')
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        window.location.href = '/brand_dashboard.html';
      }
    });
</script>

</body>
</html>
